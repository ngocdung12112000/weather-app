name: Build and Deploy to Azure Container App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/weather-app:latest .
        docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/weather-app:latest

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: weatherwebapp
        resourceGroup: WeatherAppRG
        imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/weather-app:latest
        containerAppResourceId: ${{ secrets.AZURE_CONTAINERAPP_ID }}
